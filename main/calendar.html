<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssignMate | Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar">
        <h2>
            <span class="logo-dot"></span>
            AssignMate
        </h2>
        <ul class="nav-links">
            <li><a href="task.html">Overview</a></li>
            <li class="active"><a href="calendar.html">Calendar</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="user.html">Team Members</a></li>
        </ul>
        <div class="user-profile">
            <div style="font-size: 0.75rem; color: #a78bfa; margin-bottom: 4px;">Signed in as</div>
            <div id="user-display" style="font-weight: 600; color: #fff; font-size: 0.9rem;">Admin User</div>
            <div id="user-role-display" class="profile-role">Admin</div>
            <button class="profile-logout" onclick="logout()">Sign out</button>
        </div>
    </nav>

    <main class="main-content">
        <section id="calendar-section" class="tab-section">
            <header class="section-header">
                <div>
                    <h2>Calendar</h2>
                    <div style="color: var(--text-muted); font-size: 0.72rem;">Deadlines are added to Google Calendar automatically</div>
                </div>
            </header>

            <div class="calendar-toolbar">
                <div class="calendar-toolbar-stat">
                    <span class="stat-label">Upcoming deadlines</span>
                    <span class="stat-value" id="calendar-count">0</span>
                </div>
                <div class="calendar-toolbar-stat">
                    <span class="stat-label">On Google Calendar</span>
                    <span class="stat-value" id="calendar-synced">0</span>
                </div>
            </div>

            <div id="calendar-container" class="calendar-agenda">
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </div>
                    <p>Loading deadlines...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
