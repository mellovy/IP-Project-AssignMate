<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssignMate | Task Overview</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar">
        <h2>
            <span class="logo-dot"></span>
            AssignMate
        </h2>
        <ul class="nav-links">
            <li class="active"><a href="task.html">Overview</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="user.html">Team Members</a></li>
        </ul>
        <div class="user-profile">
            <div style="font-size: 0.75rem; color: #a78bfa; margin-bottom: 4px;">Signed in as</div>
            <div id="user-display" style="font-weight: 600; color: #fff; font-size: 0.9rem;">Admin User</div>
        </div>
    </nav>

    <main class="main-content">

        <!-- Tasks Tab -->
        <section id="task-section" class="tab-section">
            <header>
                <h1>Workflow Overview &#10022;</h1>
                <p class="subtitle">Create tasks and assign them to your team.</p>
            </header>

            <div class="stats-row">
                <div class="stat-card purple">
                    <div class="stat-label">Unassigned Tasks</div>
                    <div class="stat-value" id="stat-unassigned">0</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-label">Active Team</div>
                    <div class="stat-value" id="stat-users">0</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">Completion Rate</div>
                    <div class="stat-value" id="stat-completion">0%</div>
                    <div class="progress-bar mini">
                        <div class="progress-fill" id="stat-completion-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-label">Team Velocity</div>
                    <div class="stat-value" id="stat-velocity">0</div>
                    <div class="progress-bar mini">
                        <div class="progress-fill" id="stat-velocity-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="card panel" id="task-form-panel">
                <button class="panel-toggle" onclick="togglePanel(this)">
                    <span class="panel-toggle-left">
                        <span class="panel-toggle-icon">&#10022;</span>
                        <span class="panel-toggle-title">Create New Task</span>
                    </span>
                    <span class="panel-chevron">&#9662;</span>
                </button>
                <div class="panel-body">
                    <div class="panel-body-inner">
                        <div class="form-layout">
                            <div class="form-main">
                                <div class="form-group">
                                    <label for="task-title">Task title</label>
                                    <input type="text" id="task-title" class="input-title" placeholder="What needs to be done?">
                                </div>
                                <div class="form-group">
                                    <label for="task-description">Description</label>
                                    <textarea id="task-description" placeholder="What is this task about?"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="task-specifications">Detailed specifications</label>
                                    <textarea id="task-specifications" placeholder="Any requirements, links, or acceptance criteria"></textarea>
                                </div>
                            </div>
                            <div class="form-meta">
                                <span class="form-meta-label">assignment details</span>
                                <div class="form-group">
                                    <label for="task-parent">Parent project</label>
                                    <select id="task-parent">
                                        <option value="">-- No Parent --</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="task-skill-req">Required skill</label>
                                    <select id="task-skill-req">
                                        <option value="">Select skill...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-primary" onclick="createTask()">+ Create Task</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-header">
                <span class="section-title">Active Tasks</span>
            </div>

            <div class="task-grid" id="task-container">
                <div class="empty-state" id="task-empty">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
                            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </div>
                    <p>No tasks yet &mdash; create one above!</p>
                </div>
            </div>
        </section>

        <!-- Task Detail Modal -->
        <div id="task-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <span class="tag" id="modal-type-tag">Task</span>
                        <h2 id="modal-title-display">Task Details</h2>
                    </div>
                    <button class="btn btn-ghost" onclick="closeTaskModal()" style="padding: 6px 10px;">&#10006;</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Content injected by JS -->
                </div>
                <div class="modal-footer" id="modal-footer">
                    <button class="btn btn-primary" id="modal-edit-btn" onclick="toggleEditMode()">Edit</button>
                    <button class="btn btn-ghost" id="modal-cancel-btn" onclick="closeTaskModal()" style="display: none;">Cancel</button>
                </div>
            </div>
        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
