<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssignMate | Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <main class="login-shell">
        <div class="login-brand">
            <span class="logo-dot"></span>
            <span>AssignMate</span>
        </div>

        <div class="login-card">
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" required autofocus>
                </div>
                <div id="login-error" class="login-error" role="alert"></div>
                <button type="submit" class="btn btn-primary login-submit">Sign in</button>
            </form>

            <p class="login-hint">Ask the admin to add your email.</p>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
